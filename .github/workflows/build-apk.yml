name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.artifacts.outputs.artifact_name }}
      version_name: ${{ steps.artifacts.outputs.version_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare artifacts
        id: artifacts
        shell: bash
        run: |
          metadata="app/build/outputs/apk/release/output-metadata.json"
          version_name="$(jq -r '.elements[0].versionName' "$metadata")"
          apk="dist/Pixel-IMS-5G-Plus-${version_name}.apk"
          checksum="${apk}.sha256"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$checksum"

          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Pixel-IMS-5G-Plus-${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: dist/Pixel-IMS-5G-Plus-${{ needs.build.outputs.version_name }}.apk
          CHECKSUM_PATH: dist/Pixel-IMS-5G-Plus-${{ needs.build.outputs.version_name }}.apk.sha256
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" "$CHECKSUM_PATH" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" "$CHECKSUM_PATH" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
